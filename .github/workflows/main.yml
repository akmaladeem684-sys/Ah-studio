name: Android CI Build

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Configure Android NDK
        run: |
          if [ -d "$ANDROID_SDK_ROOT/ndk/26.1.10909125" ]; then
            echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/26.1.10909125" >> $GITHUB_ENV
            echo "ANDROID_NDK_ROOT=$ANDROID_SDK_ROOT/ndk/26.1.10909125" >> $GITHUB_ENV
          else
            LATEST_NDK=$(ls -1 $ANDROID_SDK_ROOT/ndk 2>/dev/null | tail -n 1)
            if [ -n "$LATEST_NDK" ]; then
              echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/$LATEST_NDK" >> $GITHUB_ENV
              echo "ANDROID_NDK_ROOT=$ANDROID_SDK_ROOT/ndk/$LATEST_NDK" >> $GITHUB_ENV
            fi
          fi

      - name: Build Debug APK
        run: |
          # Agar settings file subfolder me ho to wahan switch karein
          SETTINGS_FILE=$(find . -maxdepth 3 -name "settings.gradle.kts" | head -n 1)
          if [ -n "$SETTINGS_FILE" ]; then
            cd $(dirname "$SETTINGS_FILE")
          fi
          
          # Direct system gradle se assemble karein
          gradle assembleDebug --stacktrace --no-daemon

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: app-debug
          path: "**/build/outputs/apk/debug/*.apk"
          retention-days: 7
