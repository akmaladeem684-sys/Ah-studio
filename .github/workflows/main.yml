name: Android CI Build

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Locate Working Directory & Make Executable
        run: |
          # Agar root pe gradlew nahi hai to subfolder dhoondhein
          if [ -f "./gradlew" ]; then
            echo "WORK_DIR=." >> $GITHUB_ENV
            chmod +x ./gradlew
          elif [ -f "./Ah-studio-main/gradlew" ]; then
            echo "WORK_DIR=./Ah-studio-main" >> $GITHUB_ENV
            chmod +x ./Ah-studio-main/gradlew
          else
            # Automatically find gradlew wherever it is
            FOUND_DIR=$(dirname $(find . -name "gradlew" | head -n 1))
            echo "WORK_DIR=$FOUND_DIR" >> $GITHUB_ENV
            chmod +x "$FOUND_DIR/gradlew"
          fi

      - name: Configure Android NDK
        run: |
          if [ -d "$ANDROID_SDK_ROOT/ndk/26.1.10909125" ]; then
            echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/26.1.10909125" >> $GITHUB_ENV
            echo "ANDROID_NDK_ROOT=$ANDROID_SDK_ROOT/ndk/26.1.10909125" >> $GITHUB_ENV
          else
            LATEST_NDK=$(ls -1 $ANDROID_SDK_ROOT/ndk | tail -n 1)
            echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/$LATEST_NDK" >> $GITHUB_ENV
            echo "ANDROID_NDK_ROOT=$ANDROID_SDK_ROOT/ndk/$LATEST_NDK" >> $GITHUB_ENV
          fi

      - name: Build Debug APK
        run: |
          cd ${{ env.WORK_DIR }}
          ./gradlew assembleDebug --stacktrace --no-daemon

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: app-debug
          path: "**/build/outputs/apk/debug/*.apk"
          retention-days: 7
